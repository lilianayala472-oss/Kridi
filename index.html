<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="الكريدي">
<meta name="theme-color" content="#eceff0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1514" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>كراس الكريدي</title>
<style>
/* Offline ledger app, Arabic (RTL) and English (LTR). No external requests. Home = clients by amount owed; client page = open credits, tap one to record a payment. */
:root{
  color-scheme:light dark;
  --bg:#eceff0; --surface:#ffffff; --ink:#13201e; --muted:#5a6b68; --line:#d8dfde;
  --accent:#0e6b5b; --accent-ink:#ffffff; --accent-soft:#dcefea;
  --debt:#b3361f; --debt-soft:#f8e3de; --ok:#2b7a4b; --ok-soft:#dff0e5;
  --scrim:rgba(10,24,21,.5);
  --f-display:-apple-system,BlinkMacSystemFont,'SF Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,'SF Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1514; --surface:#16211f; --ink:#e7f0ed; --muted:#9bb0ab; --line:#26352f;
    --accent:#4cc7ad; --accent-ink:#04201a; --accent-soft:#18332d;
    --debt:#ff907c; --debt-soft:#3a1f1a; --ok:#6fd49a; --ok-soft:#173226;
    --scrim:rgba(0,0,0,.62);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin-inline:auto;padding-block:calc(20px + env(safe-area-inset-top,0px)) 112px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:start}
input,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,.big,.amt,.av,.row b,.entry b{font-family:var(--f-display)}
ul{list-style:none;margin:0;padding:0}
p{margin:0}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.tools{display:flex;gap:8px;flex-shrink:0}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:500;text-align:start}
h1{font-size:30px;line-height:1.2;margin:2px 0 0;font-weight:800;text-wrap:balance}
.mini{height:40px;border-radius:12px;padding-inline:14px;font-size:14px;background:var(--surface);border:1px solid var(--line);font-weight:600;color:var(--accent);white-space:nowrap;text-align:center}
.lbl{font-size:14px;color:var(--muted)}
.sub{font-size:14px;color:var(--muted)}
.big{font-size:44px;line-height:1.1;font-weight:800}
.big .amt{font-weight:800}
.big .amt small{font-size:18px}

.amt{direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:700;color:var(--debt);font-variant-numeric:tabular-nums;white-space:nowrap}
.amt small{font-size:.62em;font-weight:600;margin-inline-start:.28em;opacity:.85}

.summary{display:flex;flex-direction:column;gap:2px;margin-block:22px 18px}
.banner{display:block;width:100%;background:var(--debt-soft);color:var(--debt);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:14px;text-align:start}
.banner.info{background:var(--accent-soft);color:var(--accent);font-weight:600}

.search input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding-inline:16px;font-size:16px}
.search input::placeholder{color:var(--muted)}

.list{margin-top:14px;background:var(--surface);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;width:100%;min-height:68px;padding:10px 14px}
.row:active,.entry:active{background:var(--accent-soft)}
.av{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:18px}
.who{display:flex;flex-direction:column;min-width:0}
.who b{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.who small{font-size:13px;color:var(--muted)}
.row .amt{font-size:19px}
.pill{display:inline-block;border-radius:99px;padding:2px 12px;font-size:13px;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:18px;margin-bottom:4px}

.bottombar{position:fixed;inset-inline:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 62%,transparent)}
.bottombar>button{display:block;width:100%;max-width:560px;margin-inline:auto}
.primary,.ghost,.danger{height:52px;border-radius:14px;font-weight:600;font-size:17px;padding-inline:20px;text-align:center}
.primary{background:var(--accent);color:var(--accent-ink)}
.primary:active{filter:brightness(.92)}
.ghost{background:var(--surface);border:1px solid var(--line)}
.danger{background:var(--debt-soft);color:var(--debt)}
.danger.armed{background:var(--debt);color:#fff}
.linkdanger{display:block;margin:30px auto 0;color:var(--debt);font-size:15px;min-height:44px;padding-inline:14px;border-radius:10px;text-align:center}
.linkdanger.armed{background:var(--debt);color:#fff}

.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--accent);font-weight:600;padding-inline-end:12px}
.chead h1{overflow-wrap:anywhere}
.phone{color:var(--muted);font-size:15px;margin-top:2px;text-align:start}
.owe{margin-block:18px 6px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.sec{font-size:16px;font-weight:700;color:var(--muted);margin:26px 0 8px}
.entry{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;width:100%;padding:14px;min-height:72px}
.e-main{display:flex;flex-direction:column;min-width:0}
.e-main b{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.e-main small{font-size:13px;color:var(--muted)}
.e-side{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.e-side .amt{font-size:20px}
.pay-hint{font-size:12px;color:var(--accent);font-weight:600}
.bar{grid-column:1/-1;height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok)}
.entry.settled{opacity:.7}

#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 7vh) 16px 16px;overflow-y:auto}
.scrim{position:fixed;inset:0;background:var(--scrim)}
.panel{position:relative;width:100%;max-width:520px;background:var(--surface);border-radius:20px;padding:22px 20px 20px;box-shadow:0 20px 50px rgba(0,0,0,.28)}
.panel h2{font-size:22px;margin:0 0 4px;font-weight:800;overflow-wrap:anywhere}
.panel .sub{margin-bottom:12px}
form{display:flex;flex-direction:column;gap:6px}
label{font-size:14px;color:var(--muted);margin-top:8px}
label span{opacity:.8}
.panel input,.panel textarea{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding-inline:14px;font-size:17px}
.panel input{height:50px}
.panel textarea{padding-block:10px;font-size:14px;direction:ltr;text-align:left;resize:vertical}
.panel input[inputmode="decimal"]{font-family:var(--f-display);font-weight:700;font-size:20px}
.actions{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:16px}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 6px}
.figs div{background:var(--bg);border-radius:12px;padding:10px 12px}
.figs dt{font-size:13px;color:var(--muted)}
.figs dd{margin:0;font-size:20px}
.figs dd .amt{color:var(--ink)}
.figs div.rem dd .amt{color:var(--debt)}
.chips{display:flex;gap:8px;margin-top:6px}
.chip{border:1px solid var(--accent);color:var(--accent);border-radius:99px;padding:6px 16px;font-weight:600;font-size:15px;min-height:40px}
.preview{font-size:15px;color:var(--muted);min-height:24px;margin-top:6px}
.err{color:var(--debt);font-size:14px}
.hist{margin-top:18px;border-top:1px solid var(--line);padding-top:10px}
.hist h3{font-size:14px;color:var(--muted);margin:0 0 4px;font-weight:600}
.hist li{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}
.hist .amt{color:var(--ok)}
.panel .linkdanger{margin-top:14px}
.divider{border-top:1px solid var(--line);margin-top:20px}

#toast{position:fixed;inset-inline:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;justify-content:center;pointer-events:none}
#toast span{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:15px;font-weight:500;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s}
#toast.on span{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){#toast span{transition:none}}
</style>
</head>
<body>

<main id="home">
  <div class="top">
    <div>
      <p class="eyebrow">MEDINFO · MIDO PC</p>
      <h1 data-i18n="title">كراس الكريدي</h1>
    </div>
    <div class="tools">
      <button class="mini" data-act="lang" data-i18n="langBtn">English</button>
      <button class="mini" data-act="backup" data-i18n="backup">نسخة احتياطية</button>
    </div>
  </div>
  <section class="summary" id="summary" aria-live="polite"></section>
  <div id="notice"></div>
  <div class="search"><input id="q" type="search" data-i18n-ph="searchPh" data-i18n-aria="searchPh" placeholder="قلّب على زبون" autocomplete="off" aria-label="قلّب على زبون"></div>
  <ul class="list" id="clientList"></ul>
  <div class="bottombar"><button class="primary" data-act="addClient" data-i18n="addClientBtn">+ زبون جديد</button></div>
</main>

<main id="client" hidden>
  <button class="back" data-act="back" data-i18n="back">→ الزبائن</button>
  <div id="clientBody"></div>
  <div class="bottombar"><button class="primary" data-act="addEntry" data-i18n="addEntryBtn">+ كريدي جديد</button></div>
</main>

<div id="sheet" hidden>
  <div class="scrim" data-act="closeSheet"></div>
  <div class="panel" role="dialog" aria-modal="true" id="sheetBody"></div>
</div>
<div id="toast" aria-live="polite"><span></span></div>

<script>
(function(){
  var $ = function(s){ return document.querySelector(s); };
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var round2 = function(n){ return Math.round(n * 100) / 100; };

  /* ---------- language ---------- */
  var STR = {
    ar: {
      title: 'كراس الكريدي', langBtn: 'English', backup: 'نسخة احتياطية',
      searchPh: 'قلّب على زبون', addClientBtn: '+ زبون جديد', addEntryBtn: '+ كريدي جديد', back: '→ الزبائن',
      sumLabel: 'المجموع لي باقي ليك عند الناس', sumNone: 'ما كاين حتى كريدي', sumOne: 'عند زبون واحد',
      sumMany: function(n){ return 'عند ' + n + ' د الزبائن'; },
      bannerNoStore: 'المتصفح ما كيخليش نحفظو الداتا. حل الـ app من Safari أو من الشاشة الرئيسية.',
      bannerBackup: 'دير نسخة احتياطية من الداتا باش ما تضيعش ‹',
      emptyNoClientsT: 'مازال ما زدتي حتى زبون', emptyNoClientsD: 'كليكي على «+ زبون جديد» وبدا تسجل الكريدي.',
      emptyNoMatchT: 'ما لقيت حتى زبون', emptyNoMatchD: 'جرب سمية أخرى.',
      openCount: function(n){ return n + (n === 1 ? ' كريدي مفتوح' : ' د الكريديات مفتوحين'); },
      settled: 'خالص',
      paidOf: function(p, t){ return ' · خلّص ' + p + ' من ' + t; },
      payHint: 'سجّل دفعة ‹',
      owes: 'الباقي عليه', owesZero: 'خالص، ما عندو والو',
      secCredit: 'الكريدي', secSettled: 'المخلصين',
      noOpenT: 'ما كاين حتى كريدي مفتوح', noOpenD: 'كليكي على «+ كريدي جديد» باش تسجل شي حاجة.',
      delClient: 'مسح الزبون',
      newClient: 'زبون جديد', clientName: 'إسم الزبون', phone: 'التيليفون', optional: '(اختياري)',
      cancel: 'إلغاء', addClientSubmit: 'زيد الزبون',
      newCredit: 'كريدي جديد', service: 'نوع الخدمة', servicePh: 'مثلا: تبديل شاشة',
      amountLeft: 'الثمن لي باقي (DH)', date: 'التاريخ', save: 'سجّل',
      original: 'الأصل', remaining: 'الباقي', paidNow: 'المبلغ لي خلّص دابا (DH)',
      payAll: 'خلّص الكل', recordPay: 'سجّل الدفع', close: 'سد', payments: 'الدفعات', delEntry: 'مسح هاد السطر',
      overRem: function(n){ return 'المبلغ كبر من الباقي (' + n + ' DH)'; },
      willLeft: function(n){ return 'غادي يبقى: ' + n + ' DH'; },
      willSettle: 'الحساب غادي يتخلص',
      backupTitle: 'نسخة احتياطية',
      backupText: 'الداتا كتتحفظ غير فهاد التيليفون. إلا مسحتي الـ app ولا بدلتي التيليفون كتضيع، دير نسخة من وقت لآخر.',
      lastBackup: function(d){ return ' آخر نسخة: ' + d; }, noBackupYet: ' ما درتي حتى نسخة حتى لدابا.',
      shareBtn: 'حفظ نسخة (واتساب، Notes…)',
      restoreLabel: 'رجّع من نسخة: لصق النص هنا', restoreBtn: 'رجّع الداتا (كيعوّض لي كاينة دابا)',
      confirmAgain: 'كليكي مرة أخرى باش تأكد', confirmDelete: 'كليكي مرة أخرى للمسح النهائي',
      toastCopied: 'تنسخات. لصقها فـ Notes ولا واتساب', toastManual: 'نسخ النص يدويا وحفظو',
      badBackup: 'هاد النص ماشي نسخة صحيحة. لصق النص كامل.', toastRestored: 'رجّعنا الداتا',
      toastClientDel: 'تمسح الزبون', toastEntryDel: 'تمسح السطر', toastSaved: 'تسجل الكريدي',
      toastStoreFail: 'ما قدرناش نحفظو الداتا. دير نسخة احتياطية',
      amtErr: 'كتب الثمن بالأرقام، مثلا 350', payErr: 'كتب المبلغ لي خلّص',
      toastPaidLeft: function(n){ return 'تسجل. باقي ' + n + ' DH'; }, toastSettled: 'الحساب تخلص',
      shareTitle: 'نسخة الكريدي',
      services: ['تصليح ماذربورد', 'تبديل شاشة', 'فورمات + برامج', 'تبديل باطري', 'تبديل SSD', 'بيع لابتوب', 'بيع هاتف', 'تنظيف وتبديل معجون']
    },
    en: {
      title: 'Credit Book', langBtn: 'عربي', backup: 'Backup',
      searchPh: 'Search clients', addClientBtn: '+ New client', addEntryBtn: '+ New credit', back: '← Clients',
      sumLabel: 'Total owed to you', sumNone: 'No open credit', sumOne: 'From 1 client',
      sumMany: function(n){ return 'From ' + n + ' clients'; },
      bannerNoStore: 'The browser is not letting us save data. Open the app in Safari or from the Home Screen.',
      bannerBackup: 'Back up your data so you don’t lose it ›',
      emptyNoClientsT: 'No clients yet', emptyNoClientsD: 'Tap “+ New client” to start recording credit.',
      emptyNoMatchT: 'No client found', emptyNoMatchD: 'Try another name.',
      openCount: function(n){ return n + (n === 1 ? ' open credit' : ' open credits'); },
      settled: 'Paid',
      paidOf: function(p, t){ return ' · paid ' + p + ' of ' + t; },
      payHint: 'Record payment ›',
      owes: 'Balance', owesZero: 'All paid, nothing owed',
      secCredit: 'Credit', secSettled: 'Paid off',
      noOpenT: 'No open credit', noOpenD: 'Tap “+ New credit” to record one.',
      delClient: 'Delete client',
      newClient: 'New client', clientName: 'Client name', phone: 'Phone', optional: '(optional)',
      cancel: 'Cancel', addClientSubmit: 'Add client',
      newCredit: 'New credit', service: 'Service', servicePh: 'e.g. Screen replacement',
      amountLeft: 'Amount owed (DH)', date: 'Date', save: 'Save',
      original: 'Original', remaining: 'Remaining', paidNow: 'Amount paid now (DH)',
      payAll: 'Pay in full', recordPay: 'Record payment', close: 'Close', payments: 'Payments', delEntry: 'Delete this line',
      overRem: function(n){ return 'Amount is more than the balance (' + n + ' DH)'; },
      willLeft: function(n){ return 'Remaining after: ' + n + ' DH'; },
      willSettle: 'This will settle the account',
      backupTitle: 'Backup',
      backupText: 'Your data is saved only on this phone. If you delete the app or change phones it is lost, so back up from time to time.',
      lastBackup: function(d){ return ' Last backup: ' + d + '.'; }, noBackupYet: ' You have not made a backup yet.',
      shareBtn: 'Save a backup (WhatsApp, Notes…)',
      restoreLabel: 'Restore from a backup: paste the text here', restoreBtn: 'Restore data (replaces current data)',
      confirmAgain: 'Tap again to confirm', confirmDelete: 'Tap again to delete for good',
      toastCopied: 'Copied. Paste it into Notes or WhatsApp', toastManual: 'Copy the text manually and save it',
      badBackup: 'This text is not a valid backup. Paste the whole text.', toastRestored: 'Data restored',
      toastClientDel: 'Client deleted', toastEntryDel: 'Line deleted', toastSaved: 'Credit saved',
      toastStoreFail: 'Could not save data. Make a backup',
      amtErr: 'Enter the amount in numbers, e.g. 350', payErr: 'Enter the amount paid',
      toastPaidLeft: function(n){ return 'Saved. ' + n + ' DH left'; }, toastSettled: 'Account settled',
      shareTitle: 'Credit book backup',
      services: ['Motherboard repair', 'Screen replacement', 'Format + software', 'Battery replacement', 'SSD upgrade', 'Laptop sale', 'Phone sale', 'Cleaning + thermal paste']
    }
  };
  var LOCALE = {ar: 'ar-MA-u-nu-latn', en: 'en-GB'};
  var NF = {ar: new Intl.NumberFormat('fr-FR', {maximumFractionDigits: 2}), en: new Intl.NumberFormat('en-US', {maximumFractionDigits: 2})};

  var LS = 'medinfo-kridi-v1', LS_BK = 'medinfo-kridi-lastbackup', LS_LANG = 'medinfo-kridi-lang';
  function lsGet(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
  var L = lsGet(LS_LANG) === 'en' ? 'en' : 'ar';

  var t = function(k, a, b){
    var s = STR[L][k];
    if (s == null) s = STR.ar[k];
    return typeof s === 'function' ? s(a, b) : s;
  };
  var fmtNum = function(n){ return NF[L].format(n).replace(/[  ]/g, ' '); };
  var money = function(n){ return '<span class="amt">' + fmtNum(n) + '<small>DH</small></span>'; };
  var today = function(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  var fdate = function(s){
    if (!s) return '';
    var p = s.split('-').map(Number);
    try { return new Date(p[0], p[1] - 1, p[2]).toLocaleDateString(LOCALE[L], {day: 'numeric', month: 'short'}); }
    catch (e) { return s; }
  };
  var parseAmt = function(s){
    var x = String(s).replace(/[٠-٩]/g, function(d){ return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); }).replace(/\s/g, '').replace(',', '.');
    return x === '' ? NaN : Number(x);
  };
  var genId = function(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); };

  function applyLang(){
    var h = document.documentElement;
    h.lang = L; h.dir = L === 'ar' ? 'rtl' : 'ltr';
    document.title = t('title');
    document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-i18n-ph]').forEach(function(el){ el.placeholder = t(el.dataset.i18nPh); });
    document.querySelectorAll('[data-i18n-aria]').forEach(function(el){ el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  }

  /* ---------- state ---------- */
  var clients = [], storageOK = true, current = null, ctx = {};

  function lsLoad(){ try { var d = JSON.parse(lsGet(LS) || '[]'); return Array.isArray(d) ? d : []; } catch (e) { return []; } }
  function lsSave(){
    try { localStorage.setItem(LS, JSON.stringify(clients)); }
    catch (e) { storageOK = false; toast(t('toastStoreFail')); renderHome(); }
  }
  function testStorage(){ try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return true; } catch (e) { return false; } }

  var toastTimer;
  function toast(msg){
    var el = $('#toast');
    el.querySelector('span').textContent = msg;
    el.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('on'); }, 2800);
  }

  var owed = function(c){ return round2((c.entries || []).reduce(function(s, e){ return s + Math.max(0, e.remaining); }, 0)); };
  var findClient = function(id){ return clients.find(function(c){ return c.id === id; }); };

  /* ---------- render ---------- */
  function renderHome(){
    var total = round2(clients.reduce(function(s, c){ return s + owed(c); }, 0));
    var debtors = clients.filter(function(c){ return owed(c) > 0; }).length;
    $('#summary').innerHTML = '<p class="lbl">' + t('sumLabel') + '</p><p class="big">' + money(total) + '</p><p class="sub">' +
      (debtors === 0 ? t('sumNone') : debtors === 1 ? t('sumOne') : t('sumMany', debtors)) + '</p>';

    var n = '';
    var bk = Number(lsGet(LS_BK) || 0);
    if (!storageOK) n = '<div class="banner">' + t('bannerNoStore') + '</div>';
    else if (clients.length && (!bk || Date.now() - bk > 14 * 864e5)) n = '<button class="banner info" data-act="backup">' + t('bannerBackup') + '</button>';
    $('#notice').innerHTML = n;

    var q = $('#q').value.trim().toLowerCase();
    var list = clients.filter(function(c){ return !q || c.name.toLowerCase().indexOf(q) > -1 || (c.phone || '').indexOf(q) > -1; });
    list.sort(function(a, b){ return owed(b) - owed(a) || a.name.localeCompare(b.name, L); });
    var el = $('#clientList');
    if (!clients.length) { el.innerHTML = '<li class="empty"><b>' + t('emptyNoClientsT') + '</b>' + t('emptyNoClientsD') + '</li>'; return; }
    if (!list.length) { el.innerHTML = '<li class="empty"><b>' + t('emptyNoMatchT') + '</b>' + t('emptyNoMatchD') + '</li>'; return; }
    el.innerHTML = list.map(function(c){
      var tot = owed(c), open = c.entries.filter(function(e){ return e.remaining > 0; }).length;
      var ch = (c.name.trim()[0] || '?').toUpperCase();
      return '<li><button class="row" data-act="open" data-id="' + esc(c.id) + '">' +
        '<span class="av">' + esc(ch) + '</span>' +
        '<span class="who"><b>' + esc(c.name) + '</b><small>' + (open ? t('openCount', open) : t('settled')) + '</small></span>' +
        (tot > 0 ? money(tot) : '<span class="pill ok">' + t('settled') + '</span>') + '</button></li>';
    }).join('');
  }

  function entryCard(c, e){
    var settled = e.remaining <= 0;
    var paid = round2(e.total - e.remaining);
    var pct = e.total > 0 ? Math.min(100, Math.round(paid / e.total * 100)) : 0;
    var partial = paid > 0 && !settled;
    return '<li><button class="entry' + (settled ? ' settled' : '') + '" data-act="pay" data-eid="' + esc(e.id) + '">' +
      '<span class="e-main"><b>' + esc(e.service) + '</b><small>' + fdate(e.date) + (partial ? t('paidOf', fmtNum(paid), fmtNum(e.total)) : '') + '</small></span>' +
      '<span class="e-side">' + (settled ? '<span class="pill ok">' + t('settled') + '</span>' : money(e.remaining) + '<span class="pay-hint">' + t('payHint') + '</span>') + '</span>' +
      (partial ? '<span class="bar"><i style="width:' + pct + '%"></i></span>' : '') + '</button></li>';
  }

  function renderClient(){
    var c = findClient(current);
    if (!c) return;
    var byDate = function(a, b){ return (b.date || '').localeCompare(a.date || ''); };
    var open = c.entries.filter(function(e){ return e.remaining > 0; }).sort(byDate);
    var done = c.entries.filter(function(e){ return e.remaining <= 0; }).sort(byDate);
    var tot = owed(c);
    var h = '<div class="chead"><h1>' + esc(c.name) + '</h1>' + (c.phone ? '<p class="phone"><bdi dir="ltr">' + esc(c.phone) + '</bdi></p>' : '') + '</div>';
    h += '<div class="owe"><p class="lbl">' + t('owes') + '</p>' + (tot > 0 ? '<p class="big">' + money(tot) + '</p>' : '<p><span class="pill ok">' + t('owesZero') + '</span></p>') + '</div>';
    h += '<h2 class="sec">' + t('secCredit') + '</h2>';
    h += open.length ? '<ul class="list" style="margin-top:0">' + open.map(function(e){ return entryCard(c, e); }).join('') + '</ul>'
      : '<div class="list"><p class="empty"><b>' + t('noOpenT') + '</b>' + t('noOpenD') + '</p></div>';
    if (done.length) h += '<h2 class="sec">' + t('secSettled') + '</h2><ul class="list" style="margin-top:0">' + done.map(function(e){ return entryCard(c, e); }).join('') + '</ul>';
    h += '<button class="linkdanger" data-act="delClient">' + t('delClient') + '</button>';
    $('#clientBody').innerHTML = h;
  }

  function render(){
    if (current && !findClient(current)) current = null;
    $('#home').hidden = !!current;
    $('#client').hidden = !current;
    if (current) renderClient(); else renderHome();
  }

  /* ---------- sheets ---------- */
  function openSheet(html, focusId){
    $('#sheetBody').innerHTML = html;
    $('#sheet').hidden = false;
    if (focusId) { var f = document.getElementById(focusId); if (f) f.focus(); }
  }
  function closeSheet(){ $('#sheet').hidden = true; $('#sheetBody').innerHTML = ''; }

  function sheetClient(){
    openSheet('<h2>' + t('newClient') + '</h2><form data-kind="client" autocomplete="off">' +
      '<label for="fName">' + t('clientName') + '</label><input id="fName" required>' +
      '<label for="fPhone">' + t('phone') + ' <span>' + t('optional') + '</span></label><input id="fPhone" inputmode="tel">' +
      '<div class="actions"><button type="button" class="ghost" data-act="closeSheet">' + t('cancel') + '</button><button class="primary">' + t('addClientSubmit') + '</button></div></form>', 'fName');
  }

  function sheetEntry(){
    var c = findClient(current);
    openSheet('<h2>' + t('newCredit') + '</h2><p class="sub">' + esc(c.name) + '</p><form data-kind="entry" autocomplete="off">' +
      '<label for="fSvc">' + t('service') + '</label><input id="fSvc" list="svcList" required placeholder="' + esc(t('servicePh')) + '">' +
      '<datalist id="svcList">' + STR[L].services.map(function(s){ return '<option value="' + esc(s) + '">'; }).join('') + '</datalist>' +
      '<label for="fAmt">' + t('amountLeft') + '</label><input id="fAmt" inputmode="decimal" required placeholder="0">' +
      '<label for="fDate">' + t('date') + '</label><input id="fDate" type="date" value="' + today() + '" required>' +
      '<p class="err" id="fErr" hidden></p>' +
      '<div class="actions"><button type="button" class="ghost" data-act="closeSheet">' + t('cancel') + '</button><button class="primary">' + t('save') + '</button></div></form>', 'fSvc');
  }

  function sheetPay(eid){
    var c = findClient(current); var e = c && c.entries.find(function(x){ return x.id === eid; });
    if (!e) return;
    ctx = {eid: eid};
    var settled = e.remaining <= 0;
    var h = '<h2>' + esc(e.service) + '</h2><p class="sub">' + esc(c.name) + ' · ' + fdate(e.date) + '</p>' +
      '<dl class="figs" style="margin-inline:0"><div><dt>' + t('original') + '</dt><dd>' + money(e.total) + '</dd></div><div class="rem"><dt>' + t('remaining') + '</dt><dd>' + (settled ? '<span class="pill ok">' + t('settled') + '</span>' : money(e.remaining)) + '</dd></div></dl>';
    if (!settled) {
      h += '<form data-kind="pay" autocomplete="off"><label for="fPay">' + t('paidNow') + '</label>' +
        '<input id="fPay" inputmode="decimal" placeholder="0">' +
        '<div class="chips"><button type="button" class="chip" data-act="fillAll">' + t('payAll') + '</button></div>' +
        '<p class="preview" id="payPreview"></p><p class="err" id="payErr" hidden></p>' +
        '<div class="actions"><button type="button" class="ghost" data-act="closeSheet">' + t('cancel') + '</button><button class="primary">' + t('recordPay') + '</button></div></form>';
    } else {
      h += '<div class="actions" style="grid-template-columns:1fr"><button type="button" class="ghost" data-act="closeSheet">' + t('close') + '</button></div>';
    }
    if (e.payments && e.payments.length) {
      h += '<div class="hist"><h3>' + t('payments') + '</h3><ul>' + e.payments.map(function(p){ return '<li><span>' + fdate(p.date) + '</span>' + money(p.amt) + '</li>'; }).join('') + '</ul></div>';
    }
    h += '<button type="button" class="linkdanger" data-act="delEntry">' + t('delEntry') + '</button>';
    openSheet(h, settled ? null : 'fPay');
    var inp = $('#fPay');
    if (inp) inp.addEventListener('input', function(){ updatePreview(e); });
    updatePreview(e);
  }

  function updatePreview(e){
    var inp = $('#fPay'), pv = $('#payPreview'), er = $('#payErr');
    if (!inp) return;
    er.hidden = true;
    var a = parseAmt(inp.value);
    if (inp.value.trim() === '' || isNaN(a) || a <= 0) { pv.textContent = ''; return; }
    if (a > e.remaining + 0.001) { pv.textContent = ''; er.textContent = t('overRem', fmtNum(e.remaining)); er.hidden = false; return; }
    var left = round2(e.remaining - a);
    pv.textContent = left > 0 ? t('willLeft', fmtNum(left)) : t('willSettle');
  }

  function sheetBackup(){
    var bk = Number(lsGet(LS_BK) || 0);
    var when = bk ? t('lastBackup', new Date(bk).toLocaleDateString(LOCALE[L], {day: 'numeric', month: 'long'})) : t('noBackupYet');
    openSheet('<h2>' + t('backupTitle') + '</h2>' +
      '<p class="sub">' + t('backupText') + when + '</p>' +
      '<div class="stack"><button type="button" class="primary" data-act="shareBackup">' + t('shareBtn') + '</button></div>' +
      '<div class="divider"></div>' +
      '<label for="fRestore">' + t('restoreLabel') + '</label>' +
      '<textarea id="fRestore" rows="4" placeholder="{&quot;app&quot;:&quot;kridi&quot;…"></textarea>' +
      '<p class="err" id="rErr" hidden></p>' +
      '<div class="stack"><button type="button" class="danger" data-act="restore">' + t('restoreBtn') + '</button>' +
      '<button type="button" class="ghost" data-act="closeSheet">' + t('close') + '</button></div>');
  }

  async function shareBackup(){
    var json = JSON.stringify({app: 'kridi', v: 1, savedAt: new Date().toISOString(), clients: clients});
    var ok = false;
    try {
      if (navigator.share) { await navigator.share({title: t('shareTitle'), text: json}); ok = true; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    if (!ok) {
      try { await navigator.clipboard.writeText(json); ok = true; toast(t('toastCopied')); } catch (e) {}
    }
    if (!ok) {
      var ta = $('#fRestore');
      if (ta) { ta.value = json; ta.focus(); ta.select(); }
      toast(t('toastManual'));
      return;
    }
    try { localStorage.setItem(LS_BK, String(Date.now())); } catch (e) {}
    renderHome();
  }

  function normalize(c){
    c.entries = (c.entries || []).map(function(e){
      e.total = Number(e.total) || 0; e.remaining = Number(e.remaining) || 0;
      e.payments = Array.isArray(e.payments) ? e.payments : [];
      return e;
    });
    return c;
  }
  function validBackup(d){
    return d && Array.isArray(d.clients) && d.clients.every(function(c){ return c && typeof c.id === 'string' && typeof c.name === 'string' && (c.entries == null || Array.isArray(c.entries)); });
  }
  function restore(){
    var er = $('#rErr'); er.hidden = true;
    var d;
    try { d = JSON.parse($('#fRestore').value.trim()); } catch (e) { d = null; }
    if (!validBackup(d)) { er.textContent = t('badBackup'); er.hidden = false; return; }
    clients = d.clients.map(normalize);
    lsSave(); closeSheet(); current = null; render(); toast(t('toastRestored'));
  }

  /* ---------- actions ---------- */
  function arm(btn, label, fn){
    if (btn.dataset.armed) { fn(); return; }
    var old = btn.textContent;
    btn.dataset.armed = '1'; btn.textContent = label; btn.classList.add('armed');
    setTimeout(function(){ if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = old; btn.classList.remove('armed'); } }, 4000);
  }
  function go(id){ current = id; render(); window.scrollTo(0, 0); }

  document.addEventListener('click', function(ev){
    var b = ev.target.closest('[data-act]');
    if (!b) return;
    var act = b.dataset.act;
    if (act === 'open') go(b.dataset.id);
    else if (act === 'back') go(null);
    else if (act === 'lang') {
      L = L === 'ar' ? 'en' : 'ar';
      try { localStorage.setItem(LS_LANG, L); } catch (e) {}
      applyLang(); render();
    }
    else if (act === 'addClient') sheetClient();
    else if (act === 'addEntry') sheetEntry();
    else if (act === 'pay') sheetPay(b.dataset.eid);
    else if (act === 'backup') sheetBackup();
    else if (act === 'shareBackup') shareBackup();
    else if (act === 'restore') arm(b, t('confirmAgain'), restore);
    else if (act === 'closeSheet') closeSheet();
    else if (act === 'fillAll') {
      var c = findClient(current), e = c.entries.find(function(x){ return x.id === ctx.eid; });
      $('#fPay').value = String(e.remaining); updatePreview(e);
    }
    else if (act === 'delClient') arm(b, t('confirmDelete'), function(){
      var id = current; clients = clients.filter(function(x){ return x.id !== id; });
      lsSave(); go(null); toast(t('toastClientDel'));
    });
    else if (act === 'delEntry') arm(b, t('confirmDelete'), function(){
      var c = findClient(current);
      c.entries = c.entries.filter(function(x){ return x.id !== ctx.eid; });
      lsSave(); closeSheet(); render(); toast(t('toastEntryDel'));
    });
  });

  document.addEventListener('submit', function(ev){
    ev.preventDefault();
    var kind = ev.target.dataset.kind;
    if (kind === 'client') {
      var name = $('#fName').value.trim();
      if (!name) return;
      var id = genId();
      clients.push({id: id, name: name, phone: $('#fPhone').value.trim(), createdAt: Date.now(), entries: []});
      lsSave(); closeSheet(); go(id);
    } else if (kind === 'entry') {
      var svc = $('#fSvc').value.trim(), amt = parseAmt($('#fAmt').value), date = $('#fDate').value || today();
      var er = $('#fErr');
      if (!svc) return;
      if (isNaN(amt) || amt <= 0) { er.textContent = t('amtErr'); er.hidden = false; return; }
      var cl = findClient(current);
      cl.entries.unshift({id: genId(), service: svc, total: round2(amt), remaining: round2(amt), date: date, payments: []});
      lsSave(); closeSheet(); render(); toast(t('toastSaved'));
    } else if (kind === 'pay') {
      var cc = findClient(current), e = cc.entries.find(function(x){ return x.id === ctx.eid; });
      var a = parseAmt($('#fPay').value);
      if (isNaN(a) || a <= 0) { var pe = $('#payErr'); pe.textContent = t('payErr'); pe.hidden = false; return; }
      if (a > e.remaining + 0.001) { updatePreview(e); return; }
      e.remaining = round2(Math.max(0, e.remaining - a));
      e.payments = (e.payments || []).concat([{amt: round2(a), date: today()}]);
      lsSave(); closeSheet(); render();
      toast(e.remaining > 0 ? t('toastPaidLeft', fmtNum(e.remaining)) : t('toastSettled'));
    }
  });

  $('#q').addEventListener('input', renderHome);
  document.addEventListener('keydown', function(ev){ if (ev.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

  /* ---------- start ---------- */
  storageOK = testStorage();
  clients = lsLoad().map(normalize);
  applyLang();
  render();

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();
</script>
</body>
</html>
